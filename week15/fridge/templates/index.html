<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 저녁 뭐 먹지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Claude Design 시안 B(카드형) 색과 글꼴 */
  :root {
    --bg: #FFF8F1;
    --text: #2B1D14;
    --sub: #6B5646;
    --line: #EADBCB;
    --accent: #B4410F;
    --ok-bg: #E7F4EC;
    --ok-text: #1E6B3E;
    --warn-bg: #FDECE2;
    --warn-text: #9A3412;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 16px;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 18px 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 {
    margin: 0;
    font-family: 'Gowun Dodum', sans-serif;
    font-weight: 400;
    font-size: 28px;
    line-height: 1.3;
  }
  .sub { margin: 0; color: var(--sub); font-size: 16px; }
  .card {
    background: #FFFFFF;
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 1px 3px rgba(43, 29, 20, 0.08);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .preview {
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 12px;
    border: 1.5px dashed var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--sub);
    font-size: 16px;
    overflow: hidden;
  }
  .preview img { width: 100%; height: 100%; object-fit: cover; }
  /* 파일 입력은 숨기고 label을 버튼처럼 보이게 한다 (높이 48px 이상) */
  .file-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 54px;
    border-radius: 16px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }
  .file-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .file-btn.primary { background: var(--accent); color: #FFFFFF; }
  .file-btn.secondary { background: #FFFFFF; color: var(--accent); border: 1px solid var(--line); min-height: 48px; font-size: 16px; font-weight: 500; }
  button[type=submit] {
    min-height: 54px;
    border: 0;
    border-radius: 16px;
    background: var(--text);
    color: #FFFFFF;
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
  }
  button[type=submit]:disabled { background: #CDBFB2; }
  .badge {
    align-self: flex-start;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 500;
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok-text); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-text); }
  .back {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: #FFFFFF;
    color: var(--text);
    text-decoration: none;
    font-size: 16px;
  }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 16px; }
  dt { color: var(--sub); }
  dd { margin: 0; word-break: break-all; }
</style>
</head>
<body>
<main>
{% if step == "upload" %}
  <h1>냉장고 사진 한 장으로<br>오늘 저녁 정하기</h1>
  <p class="sub">재료를 타이핑하지 않아도 돼요</p>

  {% if error %}<p class="badge warn" role="alert">{{ error }}</p>{% endif %}

  <form class="card" method="post" enctype="multipart/form-data">
    <div class="preview" id="preview">사진을 찍거나 골라 주세요</div>
    <label class="file-btn primary">
      카메라로 찍기
      <input type="file" name="photo" accept="image/*" capture="environment">
    </label>
    <label class="file-btn secondary">
      앨범에서 고르기
      <input type="file" name="photo" accept="image/*">
    </label>
    <button type="submit" id="submit" disabled>재료 인식하기</button>
  </form>

{% elif step == "received" %}
  <h1>사진을 받았어요</h1>
  <p class="sub">1단계 확인 화면입니다. 2단계에서 이 사진으로 재료를 인식합니다.</p>
  <div class="card">
    <span class="badge ok">서버 전송 성공</span>
    <dl>
      <dt>파일 이름</dt><dd>{{ filename }}</dd>
      <dt>형식</dt><dd>{{ mime }}</dd>
      <dt>크기</dt><dd>{{ size_kb }} KB</dd>
    </dl>
  </div>
  <a class="back" href="/">다른 사진 올리기</a>
{% endif %}
</main>

<script>
  // 사진을 고르면 미리보기를 보여 주고 "재료 인식하기" 버튼을 켠다.
  // 두 입력 중 하나만 서버로 가도록 다른 쪽은 비운다.
  const inputs = document.querySelectorAll('input[name="photo"]');
  const preview = document.getElementById('preview');
  const submit = document.getElementById('submit');
  inputs.forEach((input) => {
    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      inputs.forEach((other) => { if (other !== input) other.value = ''; });
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      img.alt = '고른 사진 미리보기';
      preview.replaceChildren(img);
      submit.disabled = false;
    });
  });
</script>
</body>
</html>
